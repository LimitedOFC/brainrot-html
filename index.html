<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      user-select: none;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00ff88, #00c3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    #scoreboard span {
      background: #1a1a2e;
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid #333;
    }

    #scoreboard .val {
      color: #00ff88;
      font-weight: bold;
    }

    canvas {
      border: 3px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
      display: block;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #ff4f4f;
    }

    #overlay p {
      color: #aaa;
      font-size: 1rem;
    }

    #startBtn {
      padding: 12px 36px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ff88, #00c3ff);
      color: #0f0f1a;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }

    #startBtn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }

    #controls {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #555;
    }

    .wrapper {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>🐍 SNAKE</h1>

  <div id="scoreboard">
    <span>Score: <span class="val" id="score">0</span></span>
    <span>Best: <span class="val" id="best">0</span></span>
  </div>

  <div class="wrapper">
    <canvas id="c" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">SNAKE</h2>
      <p id="overlayMsg">Eat the food. Don't hit yourself.</p>
      <button id="startBtn">▶ Start Game</button>
    </div>
  </div>

  <div id="controls">Arrow Keys or WASD to move • P to pause</div>

<script>
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const COLS   = 20;
  const ROWS   = 20;
  const CELL   = canvas.width / COLS;

  let snake, dir, nextDir, food, score, best, running, paused, loop;

  const $ = id => document.getElementById(id);
  const overlay      = $('overlay');
  const overlayTitle = $('overlayTitle');
  const overlayMsg   = $('overlayMsg');
  const startBtn     = $('startBtn');
  const scoreEl      = $('score');
  const bestEl       = $('best');

  best = parseInt(localStorage.getItem('snakeBest') || '0');
  bestEl.textContent = best;

  function init() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    paused  = false;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snakeBest', best);
      }
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // Background
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(canvas.width, j * CELL);
      ctx.stroke();
    }

    // Food — glowing circle
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL / 2);
    grd.addColorStop(0, '#ff6b6b');
    grd.addColorStop(1, '#ff000000');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff4f4f';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    // Snake body
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      // Gradient from head (bright green) to tail (dark teal)
      const r = Math.round(0   + t * 0);
      const g = Math.round(255 - t * 120);
      const b = Math.round(136 - t * 80);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2;
      const radius = i === 0 ? 5 : 3;
      roundRect(
        ctx,
        seg.x * CELL + pad,
        seg.y * CELL + pad,
        CELL - pad * 2,
        CELL - pad * 2,
        radius
      );
      ctx.fill();
    });

    // Eyes on head
    const hx = snake[0].x * CELL;
    const hy = snake[0].y * CELL;
    ctx.fillStyle = '#0f0f1a';
    const eyeOffsets = getEyeOffsets(dir);
    eyeOffsets.forEach(([ex, ey]) => {
      ctx.beginPath();
      ctx.arc(hx + ex, hy + ey, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function getEyeOffsets(d) {
    const h = CELL / 2;
    if (d.x === 1)  return [[CELL - 5, h - 4], [CELL - 5, h + 4]];
    if (d.x === -1) return [[5, h - 4], [5, h + 4]];
    if (d.y === 1)  return [[h - 4, CELL - 5], [h + 4, CELL - 5]];
    if (d.y === -1) return [[h - 4, 5], [h + 4, 5]];
    return [[CELL - 5, h - 4], [CELL - 5, h + 4]];
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function gameOver() {
    running = false;
    clearInterval(loop);
    overlayTitle.textContent = '💀 GAME OVER';
    overlayMsg.textContent   = `Score: ${score}`;
    startBtn.textContent     = '↺ Play Again';
    overlay.style.display    = 'flex';
  }

  function startGame() {
    overlay.style.display = 'none';
    init();
    running = true;
    clearInterval(loop);
    loop = setInterval(step, 120);
  }

  startBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W':
        if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; break;
      case 'ArrowDown':  case 's': case 'S':
        if (dir.y !== -1) nextDir = { x: 0, y: 1 };  break;
      case 'ArrowLeft':  case 'a': case 'A':
        if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; break;
      case 'ArrowRight': case 'd': case 'D':
        if (dir.x !== -1) nextDir = { x: 1, y: 0 };  break;
      case 'p': case 'P':
        if (!running) return;
        paused = !paused;
        if (paused) {
          clearInterval(loop);
          overlayTitle.textContent = '⏸ PAUSED';
          overlayMsg.textContent   = 'Press P to resume';
          startBtn.textContent     = '▶ Resume';
          overlay.style.display    = 'flex';
          startBtn.onclick = () => {
            overlay.style.display = 'none';
            paused = false;
            loop = setInterval(step, 120);
            startBtn.onclick = startGame;
          };
        }
        break;
    }
    // Prevent page scrolling with arrow keys
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
    }
  });

  // Draw initial static frame
  draw();
</script>
</body>
</html>
